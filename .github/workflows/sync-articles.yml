name: sync articles

# 把 social-agent（Gatsby 的项目）里 docs/articles/ 的文章同步进本博客。
# 为什么是定时而不是推事件：跨仓库触发需要额外 token，定时拉取零配置、也不会
# 因为对方仓库的权限变动而失效；每 10 分钟一次，合并后最迟十分钟上线。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步文章
        run: python3 scripts/sync_articles.py

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "sync: 同步 social-agent 的文章"
          git push origin HEAD:main