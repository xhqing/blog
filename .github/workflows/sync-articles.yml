name: sync articles

# 把 social-agent（Gatsby 的项目）里 docs/articles/ 的文章同步进本博客。
#
# 两个设计取舍，都是被限制逼出来的：
#
# 1. **定时拉取，不用跨仓库推送**：跨仓库触发需要额外的 PAT / App，定时拉取零配置、
#    不会因为对方仓库权限变动而失效。合并后最迟十分钟上线，要立刻发布就手动触发。
# 2. **直接推 main，不走 PR**：main 上有 validate 检查，但这套检查没法用在机器人身上
#    ——用 GITHUB_TOKEN 建的 PR 不会触发别的 workflow（GitHub 的防递归规则），
#    required check 永远不会出现，自动合并会一直等下去。所以改成「跑完 validate 再推」，
#    检查放在推送前，而不是 PR 上。
#
# 如果以后愿意配一个 PAT（repo 写权限 + 允许触发 workflow），可以换回「分支 + PR +
# required check + 自动合并」的形态，那样每次同步都留一条可审查的记录。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步文章
        run: python3 scripts/sync_articles.py

      - name: 推送前自检
        run: python3 scripts/validate.py

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "sync: 同步 social-agent 的文章"
          git push origin HEAD:main