name: sync articles

# 把 social-agent（Gatsby 的项目）里 docs/articles/ 的文章同步进本博客。
#
# 2026-11-13 用户立规：没有用户当轮明确同意，不能往博客发布任何文章；未完成的文章不发。
# 因此去掉定时触发，只保留 workflow_dispatch，并要求触发时显式确认用户已同意。
# 同步脚本仍只碰带 <!-- source: … --> 标记的文件，不碰手写文章。
#
# 直接推 main 不走 PR 的原因：用 GITHUB_TOKEN 建的 PR 不会触发别的 workflow
# （GitHub 防递归），required check 永远不出现、自动合并会死等。所以把门禁放在
# 「推送前跑 validate」。

on:
  workflow_dispatch:
    inputs:
      user_approved:
        description: "用户已明确同意本次发布，输入 approved"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ inputs.user_approved == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步文章
        run: python3 scripts/sync_articles.py

      - name: 推送前自检
        run: python3 scripts/validate.py

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "sync: 同步 social-agent 的文章"
          git push origin HEAD:main